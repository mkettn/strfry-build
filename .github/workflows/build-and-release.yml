name: Build and Release strfry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream strfry tag to build (e.g. 1.1.0). Leave empty for the latest stable tag."
        required: false
        default: ""
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  resolve-upstream:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.guard.outputs.skip }}

    steps:
      - name: Resolve upstream version
        id: version
        run: |
          REQUESTED_TAG="${{ github.event.inputs.tag }}"

          if [ -n "$REQUESTED_TAG" ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="$(git ls-remote --tags --refs https://github.com/hoytech/strfry.git \
              | awk -F/ '{print $NF}' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n1)"
          fi

          if [ -z "$TAG" ]; then
            echo "Could not resolve an upstream tag" >&2
            exit 1
          fi

          COMMIT="$(git ls-remote https://github.com/hoytech/strfry.git "refs/tags/${TAG}^{}" "refs/tags/${TAG}" | head -n1 | cut -f1)"

          if [ -z "$COMMIT" ]; then
            echo "Upstream tag '$TAG' not found" >&2
            exit 1
          fi

          echo "Resolved upstream tag $TAG at commit $COMMIT"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.version }} already exists, skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve-upstream
    if: needs.resolve-upstream.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ make git perl pkg-config \
            libssl-dev zlib1g-dev liblmdb-dev libflatbuffers-dev libsecp256k1-dev libzstd-dev

      - name: Clone upstream strfry
        run: |
          git clone https://github.com/hoytech/strfry.git upstream
          git -C upstream checkout "${{ needs.resolve-upstream.outputs.commit }}"
          git -C upstream submodule update --init --recursive

      - name: Build binaries
        run: |
          make -C upstream setup-golpe

          # golpe links '-lcrypto -lssl' which breaks fully static linking:
          # libssl.a must come before libcrypto.a for the linker to resolve
          # its symbols. Harmless for the dynamic build too.
          sed -i 's/-lcrypto -lssl/-lssl -lcrypto/' upstream/golpe/rules.mk

          make -C upstream -j"$(nproc)" OPT="-O3"
          make -C upstream -j"$(nproc)" BIN="strfry-static" OPT="-O3 -s" XLDFLAGS="-static"

      - name: Smoke-test binaries
        run: |
          # docopt may exit non-zero on --version; anything below 126 proves the
          # binary loads and executes (126+/signals indicate a broken binary)
          for bin in upstream/strfry upstream/strfry-static; do
            rc=0
            "$bin" --version || rc=$?
            if [ "$rc" -ge 126 ]; then
              echo "$bin failed to execute (exit $rc)" >&2
              exit "$rc"
            fi
            file "$bin"
          done
          if ldd upstream/strfry-static 2>&1 | grep -qi 'not a dynamic executable\|statically linked'; then
            echo "strfry-static is statically linked"
          else
            echo "strfry-static is NOT statically linked:" >&2
            ldd upstream/strfry-static >&2
            exit 1
          fi

      - name: Package build artifacts
        run: |
          VERSION="${{ needs.resolve-upstream.outputs.version }}"

          mkdir -p dist-dynamic dist-static
          cp upstream/strfry dist-dynamic/strfry
          cp upstream/strfry-static dist-static/strfry

          DYNAMIC_ARCHIVE="strfry-linux-${{ matrix.arch }}-${VERSION}.tar.gz"
          STATIC_ARCHIVE="strfry-linux-${{ matrix.arch }}-static-${VERSION}.tar.gz"

          tar -C dist-dynamic -czf "$DYNAMIC_ARCHIVE" strfry
          tar -C dist-static -czf "$STATIC_ARCHIVE" strfry

          sha256sum "$DYNAMIC_ARCHIVE" > "${DYNAMIC_ARCHIVE}.sha256"
          sha256sum "$STATIC_ARCHIVE" > "${STATIC_ARCHIVE}.sha256"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: strfry-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  release:
    needs:
      - resolve-upstream
      - build
    if: needs.resolve-upstream.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-upstream.outputs.version }}
          name: strfry ${{ needs.resolve-upstream.outputs.version }}
          body: |
            Linux builds of [strfry](https://github.com/hoytech/strfry) `${{ needs.resolve-upstream.outputs.version }}` (upstream commit `${{ needs.resolve-upstream.outputs.commit }}`).

            | Asset | Architecture | Linkage |
            | --- | --- | --- |
            | `strfry-linux-amd64-static-*.tar.gz` | x86_64 | static — runs on any Linux distro |
            | `strfry-linux-arm64-static-*.tar.gz` | aarch64 | static — runs on any Linux distro |
            | `strfry-linux-amd64-*.tar.gz` | x86_64 | dynamic — built on Ubuntu 24.04 |
            | `strfry-linux-arm64-*.tar.gz` | aarch64 | dynamic — built on Ubuntu 24.04 |

            Each archive contains a single `strfry` binary. Verify downloads with the matching `.sha256` file:
            `sha256sum -c strfry-linux-<arch>[-static]-${{ needs.resolve-upstream.outputs.version }}.tar.gz.sha256`
          files: |
            release/*
          make_latest: true
